[project]
name = "ipo-api"
version = "0.1.0"
description = "IPO data collector"
authors = [
    { name = "luckyyy", email = "oyslucy@naver.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
collect = "ipo_api.collect:main"

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
